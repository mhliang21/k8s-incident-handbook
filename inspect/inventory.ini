# =============================================================================
# K8s 集群巡检 - Ansible inventory
# 用法：ansible-playbook -i inventory.ini k8s-inspect.yml
#
# 注意：当前 kind 环境的节点是 Docker 容器（无 sshd），ansible 无法直接连接。
# 本文件是【生产环境模板】，把下面的 IP 换成你真实集群的节点地址即可使用。
# =============================================================================

# ---------- 当前 kind 环境节点（仅作参考，容器内无 SSH）----------
# k8s-lab-control-plane   172.18.0.4
# k8s-lab-worker          172.18.0.3
# k8s-lab-worker2         172.18.0.2

# ---------- 生产环境模板（改成真实 IP）----------
[k8s-nodes]
# control-plane 节点
node1 ansible_host=192.168.1.10 ansible_user=root
# worker 节点
node2 ansible_host=192.168.1.11 ansible_user=root
node3 ansible_host=192.168.1.12 ansible_user=root

# ---------- 可选：分组变量 ----------
[k8s-nodes:vars]
# 如果 SSH 不是 22 端口，取消注释
# ansible_port=22
# 如果用密钥登录（推荐），免密后无需密码
# ansible_ssh_private_key_file=~/.ssh/id_rsa
# 如果临时用密码（不推荐，会暴露），取消注释
# ansible_ssh_pass=your_password

# ---------- 真实 kind 节点 IP 速查 ----------
# control-plane : 172.18.0.4
# worker        : 172.18.0.3
# worker2       : 172.18.0.2
